# E2E stack for the Ratatoskr cross-component suite (test-concept.md §4).
#
# Three real services on one bridge network: Audiobookshelf, the fake Sonos speaker, and the
# Ratatoskr server. The Android app is NOT here - it runs on an emulator and reaches the server
# via `adb reverse` (see scripts/run-e2e.sh).
#
# Image refs are injected by the harness (test-concept.md §6). SERVER_IMAGE is pinned by digest
# (from the server-image dispatch payload), and ABS_IMAGE defaults to a pinned digest here.
# FAKE_SONOS_IMAGE tracks the fake's own :latest by default - it is published on its own cadence,
# not per server commit - unless a digest is pinned (see scripts/fetch-artifacts.sh).
#
# Start order matters: the server validates ABS_STREAMER_API_KEY against ABS at startup, so ABS
# must be seeded before the server starts. run-e2e.sh therefore brings up `abs` + `fake-sonos`
# first, seeds ABS, then brings up `ratatoskr` with the seeded key. Do not add a depends_on that
# would start the server early.

services:
  abs:
    image: ${ABS_IMAGE:-ghcr.io/advplyr/audiobookshelf@sha256:1eef6716183c52abafe5405e7d6be8390248ecd59c7488c44af871757ac8fc4d}
    environment:
      PORT: "13378"
    ports:
      # Published so the harness (curl) can seed and assert ABS state from the host.
      - "13378:13378"
    volumes:
      # The fixture audiobook the seeding step scans (generated by scripts/make-fixture.sh).
      - ./fixtures/audiobooks:/audiobooks:ro

  fake-sonos:
    image: ${FAKE_SONOS_IMAGE:?set FAKE_SONOS_IMAGE (ghcr.io/xexanos/ratatoskr-fake-sonos:latest or @sha256:…)}
    environment:
      PORT: "1400"
      # The zone-group Location URL the fake advertises must be reachable by the server, so it
      # must be the address the server uses to reach the fake - the compose service name.
      ADVERTISE_HOST: fake-sonos
      ROOM_NAME: E2E Test Room
      # Advance RelTime with the wall clock while PLAYING, so a real session's position moves and
      # the server syncs it back to ABS (E2E-06). Test-only; the fake defaults to a static position.
      FAKE_ADVANCE: "1"
    ports:
      # Published so the harness can query the fake's AVTransport state over SOAP directly
      # (assert-fake-transport.sh, E2E-05 stop). The server still reaches it over the bridge as
      # fake-sonos:1400 - this only adds host access.
      - "1400:1400"

  ratatoskr:
    image: ${SERVER_IMAGE:?set SERVER_IMAGE (ghcr.io/xexanos/ratatoskr-server@sha256:<digest>)}
    environment:
      # ABS is reached over the internal bridge; plain HTTP is fine inside the compose network.
      ABS_URL: http://abs:13378
      ABS_ALLOW_PLAIN_HTTP: "true"
      # Set by run-e2e.sh after seeding (the stream-only account's API key).
      ABS_STREAMER_API_KEY: ${ABS_STREAMER_API_KEY:?seed ABS first; run-e2e.sh sets this}
      # Post-ADR-0001 images (server#140/#153) refuse to boot without a session-store key. Set by
      # run-e2e.sh (generated once per run - see cmd_up for why it must stay stable within a run).
      # SESSION_STORE_PATH stays unset: the entrypoint defaults it to /data/sessions.enc.
      SESSION_STORE_KEY: ${SESSION_STORE_KEY:?run-e2e.sh 'up' generates this per run}
      # The keep-alive sweep's cadence AND the boot pass's staleness cutoff (server SPEC §7). Left
      # at the server's own daily default for almost the whole run; E2E-12 alone overrides it (via
      # the environment, which is why it is interpolated here) and recreates the server, so that
      # its boot pass finds the stored chain overdue and renews it at once - against an ABS whose
      # account the harness has just renamed, which is what marks the chain dead.
      #
      # Deliberately NOT shortened for the whole run: Audiobookshelf rate-limits authentication to
      # roughly forty requests, counts `/login` in the same bucket, and stays tripped for minutes.
      # A sweep every couple of seconds exhausts that budget within a minute, and everything that
      # authenticates afterwards - the progress write-back behind E2E-06, the re-login in E2E-12 -
      # then fails with 429 for reasons that have nothing to do with the scenario under test.
      #
      # Named with no value on purpose, so the default stays the SERVER's: compose then passes the
      # variable through empty unless the environment carries one, and an empty value is what the
      # server reads as "unset". Restating 86400000 here would silently pin today's default.
      KEEP_ALIVE_REFRESH_INTERVAL_MS:
      # Short ABS request timeout so E2E-10 (ABS stopped mid-run) surfaces the server's 502
      # "Audiobookshelf is unavailable" well under the app's ~10s read timeout - otherwise the app
      # could time out first and show a generic network error instead. Needs server#72 (the
      # ABS_REQUEST_TIMEOUT_MS knob); older images ignore the unknown var (ABS still 502s via the
      # server's default 10s, which passes today only because Docker fast-fails the stopped host).
      ABS_REQUEST_TIMEOUT_MS: "3000"
      # Point the server straight at the fake over unicast - no SSDP multicast on a bridge.
      SONOS_SEED_HOST: fake-sonos:1400
      SONOS_DISABLE_EVENTS: "1"
      # Short Sonos SOAP timeout so E2E-09 (speaker disappears -> the container is stopped, which
      # drops packets rather than refusing) surfaces "Sonos is unavailable" quickly, well inside
      # p2-speaker-lost's wait. Needs server#57 (the SONOS_REQUEST_TIMEOUT_MS knob); older images
      # ignore the unknown var and fall back to hanging, which is exactly what #57 fixes.
      SONOS_REQUEST_TIMEOUT_MS: "2000"
      PORT: "8080"
      # Fast sync so a short E2E sees progress written back quickly (server integration tuning).
      POLL_INTERVAL_SECONDS: "2"
      PROGRESS_WRITE_THRESHOLD_SECONDS: "1"
      SEEK_SETTLE_MS: "200"
      RESUME_REWIND_SECONDS: "0"
      WRITE_POSITION_BACKOFF_SECONDS: "0"
      # No TLS_CERT_PATH/TLS_KEY_PATH and no ALLOW_PLAIN_HTTP -> the image entrypoint generates a
      # self-signed cert and serves HTTPS; the app trusts it on first connect (TOFU). A fresh cert
      # per run is fine: each run installs a clean app and confirms the fingerprint anew.
    ports:
      # The app (on the emulator) reaches this via `adb reverse tcp:8080 tcp:8080` -> localhost:8080.
      - "8080:8080"
    volumes:
      # The session store lives on its own /data volume (server#133); post-ADR-0001 entrypoints
      # refuse to boot without it. Removed by cmd_down's `down -v` - the store is deliberately
      # throwaway, fresh per run.
      - ratatoskr-data:/data
      # The generated self-signed certificate, on a volume for the same reason the production
      # compose.yaml bind-mounts ./tls: the entrypoint means it to be PERSISTENT, and the app pins
      # its fingerprint on first connect (E2E-01). Without the volume it lives in the container
      # layer, so recreating the container mints a new certificate and every later flow fails the
      # trust check - which is what E2E-12 would hit when it recreates the server to shorten
      # KEEP_ALIVE_REFRESH_INTERVAL_MS. `down -v` removes it too, so each run still gets a fresh
      # certificate and E2E-01 still confirms a fingerprint it has never seen.
      - ratatoskr-tls:/tls
    depends_on:
      - abs
      - fake-sonos

volumes:
  ratatoskr-data:
  ratatoskr-tls:
