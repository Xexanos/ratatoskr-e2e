# Ratatoskr E2E - E2E-10: ABS unreachable -> sensible error surfaced (test-concept.md §5).
#
# The harness stopped the ABS container just before this flow. It runs first among the P2 cases, on
# the signed-in library end state the P1 spine leaves behind, holding a valid token (ABS runs on its
# default token TTL, so nothing expires within a run). The request below therefore fails purely on
# ABS being down (server 502 upstream_error), not on auth. Typing a query forces a new library
# request; the server maps the ABS failure to 502 {upstream_error} and the app must show its message
# as plain error text - no crash, no spinner.
appId: io.github.xexanos.ratatoskr
---
- assertVisible:
    id: "library_search"
- tapOn:
    id: "library_search"
- inputText: "zzzz-abs-down-probe"
- extendedWaitUntil:
    visible: "Audiobookshelf is unavailable"
    timeout: 15000             # 300ms debounce + request timeout headroom
