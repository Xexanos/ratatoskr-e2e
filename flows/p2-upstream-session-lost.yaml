# Ratatoskr E2E - E2E-12: the server lost its Audiobookshelf session, so the app must ask for the
# PASSWORD - not show the generic "you were signed out" (test-concept.md §5, server ADR-0001 /
# SPEC §8, app SPEC §5). Both land on the same screen, so the notice copy is the only thing that
# tells the two apart - which is exactly what this asserts.
#
# The fixture, staged by run-e2e.sh: the app's ABS account was renamed while the server was
# stopped, and the server was then brought back with a short KEEP_ALIVE_REFRESH_INTERVAL_MS. Its
# keep-alive boot pass therefore finds the stored chain overdue and spends its refresh token at
# once; ABS refuses it, because the account that token names no longer exists under that name, and
# the chain is marked dead. From there every request of that device is answered
# 401 {code: UPSTREAM_SESSION_LOST}.
#
# This flow deliberately does NOT launchApp - it attaches to the app the previous scenario left in
# the foreground, whose 5s session poll is what meets that 401. The notice is the app's answer to
# "why am I on this screen", so it lives only in the process that was sent here (app
# ConnectionManager: a volatile field, consumed on read); a relaunch would land on a pre-filled
# sign-in with no notice at all and this flow would fail on an app that is behaving correctly.
#
# The wait therefore absorbs both asynchronous steps at once: the boot refresh (deliberately
# non-blocking, so it can still be in flight when /health first answers) and the app poll that
# carries the 401.
appId: io.github.xexanos.ratatoskr
---
- extendedWaitUntil:
    visible: "Your media-server sign-in expired. Enter your password to reconnect."
    timeout: 45000             # async boot refresh + one 5s app poll, with generous margin
- assertNotVisible: "You were signed out. Enter your password to sign in again."
# ...and it is a password-only prompt: the username is already filled in from storage. That is
# what lets the harness put the ABS account back under its old name before the recovery flow -
# the server signs in with the username it stored, and only the password travels from here.
- assertVisible: "${ABS_USER}"
